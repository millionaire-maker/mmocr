# 中文自然场景预训练：更偏“可读性 + 真实背景”，并保留一定比例的弯曲与成像退化。
# 注意：实际弯曲比例建议通过 wrapper 的 --curve-ratio 动态覆盖（会写入 curve.enable/curve.fraction）。

font_size:
  min: 14
  max: 30

# BGR 彩色文字。尽量减少“过浅/低对比”导致的人眼也难辨识样本：降低 white 比例 + 适度描边。
font_color:
  enable: true
  black:
    fraction: 0.38
    l_boundary: [0, 0, 0]
    h_boundary: [60, 60, 60]
  dark_gray:
    fraction: 0.22
    l_boundary: [40, 40, 40]
    h_boundary: [120, 120, 120]
  white:
    fraction: 0.05
    l_boundary: [210, 210, 210]
    h_boundary: [255, 255, 255]
  red:
    fraction: 0.12
    l_boundary: [140, 0, 0]
    h_boundary: [255, 90, 90]
  blue:
    fraction: 0.12
    l_boundary: [0, 0, 120]
    h_boundary: [90, 90, 255]
  brown:
    fraction: 0.11
    l_boundary: [120, 60, 20]
    h_boundary: [200, 130, 90]

random_space:
  enable: false
  fraction: 0.3
  min: -0.1
  max: 0.1

# 弯曲形变（sin remap）。强度由 min/max 控制；比例由 wrapper 覆盖更灵活。
curve:
  enable: true
  fraction: 0.30
  period: 720
  min: 1
  max: 6

# 轻度裁切误差：模拟检测裁切不准，但避免频繁“切断”字符。
crop:
  enable: true
  fraction: 0.15
  top:
    min: 1
    max: 3
  bottom:
    min: 1
    max: 3

# 自然背景：几乎总是用真实背景图（bg_proc）
img_bg:
  enable: true
  fraction: 0.98

text_border:
  enable: true
  fraction: 0.18
  light:
    enable: true
    fraction: 0.4
  dark:
    enable: true
    fraction: 0.6

# 真实融合：少量开启，避免太慢/太“糊”
seamless_clone:
  enable: true
  fraction: 0.12

# 轻中度透视/旋转：更贴近街景拍摄
perspective_transform:
  max_x: 14
  max_y: 14
  max_z: 5

blur:
  enable: true
  fraction: 0.07

prydown:
  enable: true
  fraction: 0.18
  max_scale: 1.8

noise:
  enable: true
  fraction: 0.28
  gauss:
    enable: true
    fraction: 0.40
  uniform:
    enable: true
    fraction: 0.35
  salt_pepper:
    enable: true
    fraction: 0.15
  poisson:
    enable: true
    fraction: 0.10

line:
  enable: false
  fraction: 0.05
  random_over:
    enable: true
    fraction: 0.2
  under_line:
    enable: false
    fraction: 0.2
  table_line:
    enable: false
    fraction: 0.3
  middle_line:
    enable: false
    fraction: 0.3

line_color:
  enable: false
  black:
    fraction: 0.5
    l_boundary: [0, 0, 0]
    h_boundary: [64, 64, 64]
  blue:
    fraction: 0.5
    l_boundary: [0, 0, 150]
    h_boundary: [60, 60, 255]

reverse_color:
  enable: false
  fraction: 0.05

emboss:
  enable: false
  fraction: 0.05

sharp:
  enable: false
  fraction: 0.05

