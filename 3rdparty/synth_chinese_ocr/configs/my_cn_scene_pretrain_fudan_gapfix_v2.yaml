# 更贴近 Fudan(Scene) 的中文自然场景合成配置（用于“补齐域差”子集）- v2
#
# v2 目标（在 v1 基础上进一步对齐亮度/弯曲强度）：
# - Fudan 的 mean_intensity≈117（更暗）；v1 gapfix 小样本均值仍偏亮（≈136）
# - Fudan curved 样本比例整体不高，但存在透视/拍摄形变；因此 gapfix 子集默认用更低的 curve
#
# 说明：
# - 弯曲比例最终以 wrapper 的 --curve-ratio 为准（会覆盖 curve.fraction）
# - 亮度无法用单一参数精确控制，这里主要通过提高 reverse_color + 降低白色字体比例来拉低整体均值

font_size:
  min: 12
  max: 30

font_color:
  enable: true
  black:
    fraction: 0.40
    l_boundary: [0, 0, 0]
    h_boundary: [70, 70, 70]
  dark_gray:
    fraction: 0.22
    l_boundary: [40, 40, 40]
    h_boundary: [120, 120, 120]
  white:
    fraction: 0.08
    l_boundary: [210, 210, 210]
    h_boundary: [255, 255, 255]
  red:
    fraction: 0.14
    l_boundary: [140, 0, 0]
    h_boundary: [255, 90, 90]
  blue:
    fraction: 0.10
    l_boundary: [0, 0, 120]
    h_boundary: [90, 90, 255]
  brown:
    fraction: 0.06
    l_boundary: [120, 60, 20]
    h_boundary: [200, 130, 90]

random_space:
  enable: false
  fraction: 0.3
  min: -0.1
  max: 0.1

curve:
  enable: true
  # 默认更低的弯曲比例（更贴近 Fudan），需要更高弯曲比例请在命令行加 --curve-ratio 覆盖
  fraction: 0.08
  period: 720
  min: 1
  max: 4

crop:
  enable: true
  fraction: 0.25
  top:
    min: 1
    max: 4
  bottom:
    min: 1
    max: 4

img_bg:
  enable: true
  fraction: 0.99

text_border:
  enable: true
  fraction: 0.25
  light:
    enable: true
    fraction: 0.45
  dark:
    enable: true
    fraction: 0.55

seamless_clone:
  enable: true
  fraction: 0.18

perspective_transform:
  max_x: 16
  max_y: 16
  max_z: 8

blur:
  enable: true
  fraction: 0.15

prydown:
  enable: true
  fraction: 0.35
  max_scale: 3.0

noise:
  enable: true
  fraction: 0.35
  gauss:
    enable: true
    fraction: 0.40
  uniform:
    enable: true
    fraction: 0.35
  salt_pepper:
    enable: true
    fraction: 0.15
  poisson:
    enable: true
    fraction: 0.10

line:
  enable: true
  fraction: 0.06
  random_over:
    enable: true
    fraction: 1.0
  under_line:
    enable: false
    fraction: 0.1
  table_line:
    enable: false
    fraction: 0.1
  middle_line:
    enable: false
    fraction: 0.1

line_color:
  enable: true
  black:
    fraction: 0.7
    l_boundary: [0, 0, 0]
    h_boundary: [80, 80, 80]
  blue:
    fraction: 0.3
    l_boundary: [0, 0, 150]
    h_boundary: [60, 60, 255]

reverse_color:
  enable: true
  # v2：提高比例，进一步拉低整体亮度均值并覆盖夜景/室内暗背景
  fraction: 0.20

# 亮度缩放：进一步对齐 Fudan 更暗的整体亮度分布（不依赖背景素材本身的曝光分布）
# 实现位置：textrenderer/renderer.py（可选项，缺省不启用）
brightness:
  enable: true
  fraction: 0.70
  # scale 会乘到整张图上，min 越小越暗；过小会导致大量“人眼不可读”
  min: 0.65
  max: 1.0

emboss:
  enable: false
  fraction: 0.05

sharp:
  enable: false
  fraction: 0.05
